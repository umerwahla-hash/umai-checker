name: Check UMAI Reservations

on:
  schedule:
    # Runs at minute 0 past every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-slots:
    runs-on: ubuntu-24.04
    # Leaves room for Cloudflare's waiting room (script waits up to 8 min)
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore alert state
        # Remembers which slots we already emailed about, so we don't email hourly
        uses: actions/cache@v4
        with:
          path: .umai_state.json
          key: umai-state-${{ github.run_id }}
          restore-keys: |
            umai-state-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Playwright Script
        env:
          # Securely pull credentials from GitHub Secrets
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python check_rembayung.py
